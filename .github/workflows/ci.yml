name: CI

on:
    push:
        branches: [master]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    NODE_VERSION: 20

jobs:
    server:
        name: Server — typecheck, unit tests, build
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: server
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: server/package-lock.json
            - run: npm ci
            - run: npx prisma generate
            - run: npm run typecheck
            - run: npm test
            - run: npm run build

    client:
        name: Client — typecheck, unit tests, build
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: client
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: client/package-lock.json
            - run: npm ci
            - run: npm run typecheck
            - run: npm test
            - run: npm run build

    e2e:
        name: End-to-end (Playwright)
        needs: [server, client]
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # Throwaway database for this run only — see client/e2e/README.md.
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: dmnotebook_e2e_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dmnotebook_e2e_test
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: |
                      server/package-lock.json
                      client/package-lock.json
            - name: Install server dependencies
              run: npm ci && npx prisma generate
              working-directory: server
            - name: Install client dependencies
              run: npm ci
              working-directory: client
            - name: Install Playwright browser
              run: npx playwright install --with-deps chromium
              working-directory: client
            - name: Run end-to-end tests
              run: npm run test:e2e
              working-directory: client
            - name: Upload Playwright report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      client/playwright-report/
                      client/test-results/
                  retention-days: 14
