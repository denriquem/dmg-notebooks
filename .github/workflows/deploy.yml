name: Deploy

# Deploys to Render only after CI has passed on master. Render's own
# auto-deploy must be turned off for both services, otherwise every push
# deploys straight away without waiting for the tests.
on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [master]
    workflow_dispatch:

# Never run two deploys at once, and never cancel one halfway through.
concurrency:
    group: deploy-production
    cancel-in-progress: false

permissions:
    contents: read

env:
    NODE_VERSION: 20
    # The commit CI tested (workflow_run) or the commit picked by hand (dispatch).
    DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
    migrate:
        name: Migrate Supabase database
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.event == 'push')
        runs-on: ubuntu-latest
        environment: production
        defaults:
            run:
                working-directory: server
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ env.DEPLOY_SHA }}
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: server/package-lock.json
            - run: npm ci
            # `migrate deploy` only applies committed migrations — it never
            # resets or prompts. Runs before the server deploy so new code
            # never starts against an old schema.
            - name: Apply migrations
              run: npx prisma migrate deploy
              env:
                  DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
                  DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}

    deploy:
        name: Deploy ${{ matrix.service }} to Render
        needs: migrate
        runs-on: ubuntu-latest
        environment: production
        strategy:
            matrix:
                include:
                    - service: server
                      hook: RENDER_SERVER_DEPLOY_HOOK
                    - service: client
                      hook: RENDER_CLIENT_DEPLOY_HOOK
        steps:
            - name: Trigger Render deploy
              env:
                  HOOK_URL: ${{ secrets[matrix.hook] }}
              run: |
                  if [ -z "$HOOK_URL" ]; then
                      echo "::error::Secret ${{ matrix.hook }} is not set in the production environment."
                      exit 1
                  fi
                  # `ref` pins the deploy to the exact commit CI tested.
                  curl --fail --silent --show-error -X POST "${HOOK_URL}&ref=${DEPLOY_SHA}"
                  echo "Triggered ${{ matrix.service }} deploy of ${DEPLOY_SHA}."
